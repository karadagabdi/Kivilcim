<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kıvılcım · Quizlerin</title>
  <link rel="icon" href="/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="studio">
  <header class="bar">
    <a class="brand" href="/olustur"><img src="/logo.svg" alt="" width="26" height="26">Kıvılcım <small>Quiz stüdyosu</small></a>
    <nav class="meta"><a href="/">Oyuna katıl →</a></nav>
  </header>
  <main id="app" class="studio-main"></main>

  <dialog id="paste" class="sheet">
    <form method="dialog" class="sheet-body">
      <h2>Metinden içe aktar</h2>
      <p class="muted">Sorularını aşağıdaki gibi yapıştır. Doğru şıkkın sonuna <b>*</b> koy ya da altına <b>Cevap: B</b> yaz. İşaretlemediklerini sonra seçebilirsin.</p>
      <pre class="example">1. Bir yılda kaç ay vardır?
A) 10
B) 12 *
C) 13

2. Suyun kimyasal formülü nedir?
A) CO2
B) H2O
C) O2
Cevap: B</pre>
      <textarea id="paste-text" rows="10" placeholder="Sorularını buraya yapıştır…"></textarea>
      <div class="sheet-actions">
        <button class="btn ghost" value="cancel">Vazgeç</button>
        <button class="btn primary" value="ok" id="paste-ok">İçe aktar</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="file" accept=".json,.csv,.tsv,.txt" hidden>
  <script src="/common.js"></script>
  <script src="/library.js"></script>
  <script src="/olustur.js"></script>
</body>
</html>
